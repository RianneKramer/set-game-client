<form (submit)="onSubmit($event)">
  <div>
    <label>
      Username
      <input type="text" [formField]="loginForm.username" />
    </label>
    @if (loginForm.username().invalid() && loginForm.username().touched()) {
      <div class="error">
        @for (error of loginForm.username().errors(); track error.kind) {
          <span>{{error.message}}</span>
        }
      </div>
  }
  </div>

  <div>
    <label>
      Password
      <input type="password" [formField]="loginForm.password" />
      @if (loginForm.password().invalid() && loginForm.password().touched()){
        <div class="error">
          @for (error of loginForm.password().errors(); track error.kind) {
            <span>{{ error.message }}</span>
          }
        </div>
      }
    </label>
  </div>

  <button type="submit" [disabled]="loginForm().invalid()">Log in</button>

</form>

<div class="form-debug">
  <h3>Current Form Values:</h3>
  <p>Username: {{ loginForm.username().value() }}</p>
  <p>Password: {{ loginForm.password().value() ? '••••••••' : '(empty)' }}</p>
</div>
