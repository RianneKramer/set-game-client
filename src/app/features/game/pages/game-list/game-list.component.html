@if (loading) {
  <span class="spinner"></span>
} @else {
  <div class="games-container">
    <h2>My Games</h2>

    <div class="create-section">
      <button class="create-btn" (click)="createGame()">
        + Start New Game
      </button>
    </div>

    <div class="games-section">
      <h3>Continue Playing</h3>

      @if (games()!.length === 0) {
        <p class="empty">No games yet. Start a new one!</p>
      } @else {
        <div class="games-list">
          @for (game of games(); track game.id) {
            <div class="game-card" [routerLink]="['/game', game.id]">
              <div class="game-info">
                <p class="date">
                  {{ game.startedAt | date:'yyyy-MM-dd HH:mm' }}
                </p>
                <p class="status">
                  {{ game.isFinished ? 'Finished' : 'In Progress' }}
                </p>
              </div>
              <span class="arrow">→</span>
            </div>
          }
        </div>
      }
    </div>
  </div>
}
