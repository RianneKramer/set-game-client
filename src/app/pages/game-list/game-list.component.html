<h2>My Games</h2>

<button (click)="createGame()">New Game</button>

<div class="continue-list">
  <p>Existing Games</p>
  @for (game of games; track game.id) {
    <button [routerLink]="['/game', game.id]" class="continue">Continue game from {{game.startedAt | date:'yyyy-MM-dd HH:mm'}}</button>
  }
</div>
